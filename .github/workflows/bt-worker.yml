name: bt-worker
on:
  push:
    branches: [master]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bt-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scalp-lab/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: scalp-lab
      - uses: actions/cache@v4
        with:
          path: scalp-lab/.cache
          key: bt-cache-v3
      - run: |
          mkdir -p reports
          python worker.py --budget 40
        working-directory: scalp-lab
        continue-on-error: true
      - name: Commit results
        if: always()
        working-directory: scalp-lab
        run: |
          git config user.name "bt-bot"
          git config user.email "bt-bot@users.noreply.github.com"
          git add results 2>/dev/null || true
          git add reports 2>/dev/null || true
          if git status --porcelain | grep -q .; then
            git commit -m "auto: backtest results update [skip ci]"
            git pull --rebase origin master || true
            git push || echo "push failed, will retry next run"
          else
            echo "nothing to commit"
          fi
